vich_uploader:
    db_driver: orm
    
    metadata:
        type: attribute

    mappings:
        task_attachments:
            uri_prefix: /uploads/tasks
            upload_destination: '%kernel.project_dir%/public/uploads/tasks'
            namer: Vich\UploaderBundle\Naming\SmartUniqueNamer
            delete_on_remove: true
            delete_on_update: true
            inject_on_load: true