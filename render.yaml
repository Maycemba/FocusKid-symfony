# ==============================================================================
# FocusKid - Spécification Render Blueprint
# Hébergement complet en un clic (Base de données + Web Symfony + API Python AI)
# ==============================================================================
services:
  # ----------------------------------------------------------------------------
  # 1. API Python AI (Service d'Inférence d'Émotions & Stress)
  # ----------------------------------------------------------------------------
  - type: web
    name: focuskid-ai
    env: docker
    dockerfilePath: python_ai/Dockerfile
    dockerContext: python_ai
    plan: free
    envVars:
      - key: PORT
        value: 5001
      - key: HOST
        value: 0.0.0.0

  # ----------------------------------------------------------------------------
  # 2. Application Web Symfony (Interface utilisateur & Contrôleurs)
  # ----------------------------------------------------------------------------
  - type: web
    name: focuskid-web
    env: docker
    dockerfilePath: Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: APP_ENV
        value: prod
      - key: APP_DEBUG
        value: "0"
      - key: APP_SECRET
        generateValue: true
      # Liaison automatique avec la base de données PostgreSQL ci-dessous
      - key: DATABASE_URL
        fromDatabase:
          name: focuskid-db
          property: connectionString
      # Liaison réseau privée et sécurisée interne avec l'API d'IA
      - key: PYTHON_API_URL
        value: http://focuskid-ai:5001

# ------------------------------------------------------------------------------
# 3. Base de données PostgreSQL managée
# ------------------------------------------------------------------------------
databases:
  - name: focuskid-db
    plan: free
